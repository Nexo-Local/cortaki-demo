<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editar perfil — CortaKi</title><link rel="stylesheet" href="assets/css/style.css"></head><body><div class="app-shell"><div id="topbar"></div><main class="page"><form id="profile-form" class="card"><div style="text-align:center;margin-bottom:18px"><img id="avatar-preview" style="width:92px;height:92px;border-radius:24px;object-fit:cover;background:var(--surface-2);display:block;margin:0 auto 10px"><label class="btn btn-secondary btn-sm" for="avatar-input">📷 Alterar foto</label><input id="avatar-input" type="file" accept="image/*" hidden></div><div class="field"><label>Nome completo</label><input id="name" required maxlength="60"></div><div class="field"><label>Telefone</label><input id="phone" required></div><button class="btn btn-primary btn-block">Salvar perfil</button><div id="notice" class="small" style="display:none;color:var(--success);margin-top:10px;text-align:center">Alterações salvas ✓</div></form><div class="section-title"><h2>Meus endereços</h2></div><form id="address-form" class="card"><input id="address-index" type="hidden"><div class="field"><label>Nome do endereço</label><input id="address-label" required placeholder="Casa, trabalho..."></div><div class="field"><label>Endereço completo</label><input id="address-text" required placeholder="Rua, número, bairro e cidade"></div><div class="field"><label>Complemento</label><input id="address-complement" placeholder="Apartamento ou referência"></div><button class="btn btn-secondary btn-block" id="address-submit">Adicionar endereço</button></form><div id="addresses" style="display:flex;flex-direction:column;gap:9px;margin-top:10px"></div></main><div id="bottom-nav"></div></div><script src="assets/js/mock-data.js"></script><script src="assets/js/app.js"></script><script>renderTopbar({title:'Editar perfil'});renderBottomNav('perfil');const me=DEMO_USERS.customer,KEYS={name:'navalha_customer_name',phone:'navalha_customer_phone',avatar:'navalha_customer_avatar',addresses:'navalha_customer_addresses'};let avatar=localStorage.getItem(KEYS.avatar)||avatarFor(me.id,localStorage.getItem(KEYS.name)||me.name),addresses=safeStoredJSON(KEYS.addresses,[]);const preview=document.getElementById('avatar-preview');preview.src=avatar;document.getElementById('name').value=localStorage.getItem(KEYS.name)||me.name;document.getElementById('phone').value=localStorage.getItem(KEYS.phone)||me.phone;document.getElementById('avatar-input').onchange=async e=>{try{avatar=await readProfileImage(e.target.files[0]);preview.src=avatar}catch(err){alert(err.message)}};document.getElementById('profile-form').onsubmit=e=>{e.preventDefault();localStorage.setItem(KEYS.name,document.getElementById('name').value.trim());localStorage.setItem(KEYS.phone,document.getElementById('phone').value.trim());localStorage.setItem(KEYS.avatar,avatar);const n=document.getElementById('notice');n.style.display='block';setTimeout(()=>n.style.display='none',1800)};function renderAddresses(){document.getElementById('addresses').innerHTML=addresses.length?addresses.map((a,i)=>`<div class="card" style="display:flex;gap:10px;align-items:start"><div style="flex:1"><strong class="small">${a.label}</strong><div class="small muted" style="margin-top:3px">${a.text}${a.complement?' · '+a.complement:''}</div></div><button class="btn btn-ghost btn-sm" data-edit="${i}">Editar</button><button class="btn btn-ghost btn-sm" data-remove="${i}">✕</button></div>`).join(''):'<div class="card small muted">Nenhum endereço cadastrado.</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const a=addresses[b.dataset.edit];document.getElementById('address-index').value=b.dataset.edit;document.getElementById('address-label').value=a.label;document.getElementById('address-text').value=a.text;document.getElementById('address-complement').value=a.complement||'';document.getElementById('address-submit').textContent='Salvar endereço'});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{addresses.splice(Number(b.dataset.remove),1);localStorage.setItem(KEYS.addresses,JSON.stringify(addresses));renderAddresses()})}document.getElementById('address-form').onsubmit=e=>{e.preventDefault();const i=document.getElementById('address-index').value,a={label:document.getElementById('address-label').value.trim(),text:document.getElementById('address-text').value.trim(),complement:document.getElementById('address-complement').value.trim()};if(i==='')addresses.push(a);else addresses[Number(i)]=a;localStorage.setItem(KEYS.addresses,JSON.stringify(addresses));e.target.reset();document.getElementById('address-index').value='';document.getElementById('address-submit').textContent='Adicionar endereço';renderAddresses()};renderAddresses();</script></body></html>
