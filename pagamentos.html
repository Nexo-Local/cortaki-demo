<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagamentos — CortaKi</title><link rel="stylesheet" href="assets/css/style.css"></head><body><div class="app-shell"><div id="topbar"></div><main class="page"><div class="card" style="background:linear-gradient(180deg,var(--gold-wash),var(--surface));border-color:var(--gold-dim)"><div class="small muted">Saldo CortaKi</div><div id="balance" class="mono" style="font-size:29px;font-weight:700;color:var(--gold-bright);margin:5px 0 13px">R$ 0,00</div><div style="display:flex;gap:8px"><button class="btn btn-primary btn-sm quick" data-value="20">+ R$ 20</button><button class="btn btn-primary btn-sm quick" data-value="50">+ R$ 50</button><button class="btn btn-primary btn-sm quick" data-value="100">+ R$ 100</button></div></div><div class="section-title"><h2>Carregar outro valor</h2></div><form id="balance-form" class="card"><div class="field"><label>Valor da recarga</label><input id="amount" type="number" min="1" step="0.01" required placeholder="R$ 0,00"></div><div class="field"><label>Forma de pagamento</label><select id="recharge-method"><option>PIX</option><option>Cartão cadastrado</option></select></div><button class="btn btn-primary btn-block">Confirmar recarga</button><div id="payment-notice" class="small" style="display:none;color:var(--success);margin-top:10px;text-align:center">Pagamento aprovado e saldo adicionado ✓</div></form><div class="section-title"><h2>Formas de pagamento</h2></div><form id="card-form" class="card"><div class="field"><label>Apelido do cartão</label><input id="card-label" placeholder="Ex.: Cartão principal" required></div><div class="field"><label>Número do cartão</label><input id="card-number" inputmode="numeric" maxlength="19" placeholder="0000 0000 0000 0000" required></div><div class="management-grid-2"><div class="field"><label>Validade</label><input id="card-expiry" maxlength="5" placeholder="MM/AA" required></div><div class="field"><label>CVV</label><input id="card-cvv" type="password" maxlength="4" placeholder="123" required></div></div><button class="btn btn-secondary btn-block">Adicionar cartão</button><p class="small muted" style="margin-top:9px">No protótipo, somente a bandeira e os quatro últimos dígitos são salvos.</p></form><div id="cards" style="display:flex;flex-direction:column;gap:9px;margin-top:10px"></div></main><div id="bottom-nav"></div></div><script src="assets/js/mock-data.js"></script><script src="assets/js/app.js"></script><script>renderTopbar({title:'Pagamentos'});renderBottomNav('perfil');const BALANCE='navalha_customer_balance',CARDS='cortaki_customer_cards';let cards=safeStoredJSON(CARDS,[]);function renderBalance(){document.getElementById('balance').textContent=formatBRL(Number(localStorage.getItem(BALANCE)||0))}function addBalance(value){localStorage.setItem(BALANCE,String(Number(localStorage.getItem(BALANCE)||0)+Number(value)));renderBalance();const n=document.getElementById('payment-notice');n.style.display='block';setTimeout(()=>n.style.display='none',1900)}document.querySelectorAll('.quick').forEach(b=>b.onclick=()=>addBalance(b.dataset.value));document.getElementById('balance-form').onsubmit=e=>{e.preventDefault();addBalance(document.getElementById('amount').value);e.target.reset()};function renderCards(){document.getElementById('cards').innerHTML=cards.length?cards.map((c,i)=>`<div class="card" style="display:flex;align-items:center;gap:12px"><span style="font-size:22px">💳</span><div style="flex:1"><strong class="small">${c.label}</strong><div class="small muted">${c.brand} •••• ${c.last4} · ${c.expiry}</div></div><button class="btn btn-ghost btn-sm" data-remove="${i}">Remover</button></div>`).join(''):'<div class="card small muted">Nenhum cartão cadastrado.</div>';document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cards.splice(Number(b.dataset.remove),1);localStorage.setItem(CARDS,JSON.stringify(cards));renderCards()})}document.getElementById('card-form').onsubmit=e=>{e.preventDefault();const digits=document.getElementById('card-number').value.replace(/\D/g,'');if(digits.length<13)return alert('Digite um número de cartão válido.');cards.push({label:document.getElementById('card-label').value.trim(),brand:digits[0]==='4'?'Visa':digits[0]==='5'?'Mastercard':'Cartão',last4:digits.slice(-4),expiry:document.getElementById('card-expiry').value});localStorage.setItem(CARDS,JSON.stringify(cards));e.target.reset();renderCards()};renderBalance();renderCards();</script></body></html>
