<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notificações — CortaKi</title><link rel="stylesheet" href="assets/css/style.css"></head><body><div class="app-shell"><div id="topbar"></div><main class="page"><div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button class="btn btn-secondary btn-sm" id="mark-read">Marcar todas como lidas</button></div><div id="notifications-list" style="display:flex;flex-direction:column;gap:10px"></div></main><div id="bottom-nav"></div></div><script src="assets/js/mock-data.js"></script><script src="assets/js/app.js"></script><script>renderTopbar({title:'Notificações'});renderBottomNav('home');const KEY='navalha_customer_notifications',customerId=DEMO_USERS.customer.id;function getAll(){let all=safeStoredJSON(KEY,[]);if(!Array.isArray(all))all=[];if(!all.some(x=>x.id==='app-update-security-v1')){all.unshift({id:'app-update-security-v1',customerId,type:'app-update',message:'A verificação por código protege o início e a conclusão dos atendimentos.',createdAt:new Date().toISOString(),read:false});localStorage.setItem(KEY,JSON.stringify(all))}return all}function titleFor(type){if(type==='payment-confirmed')return'Pagamento confirmado';if(type==='barber-cancellation')return'Serviço cancelado';if(type==='app-update')return'Atualização do aplicativo';return'Atualização do atendimento'}function iconFor(type){if(type==='payment-confirmed')return'✅';if(type==='barber-cancellation')return'⚠️';if(type==='app-update')return'✨';return'🔔'}function render(){const mine=getAll().filter(x=>x.customerId===customerId);document.getElementById('notifications-list').innerHTML=mine.length?mine.map(item=>`<div class="card" style="display:flex;gap:12px;border-color:${item.read?'var(--border)':'var(--gold-dim)'}"><div style="font-size:21px">${iconFor(item.type)}</div><div style="flex:1"><strong style="font-size:13.5px">${titleFor(item.type)}</strong><p class="small muted" style="margin-top:4px;line-height:1.5">${item.message}</p><div class="small" style="color:var(--text-faint);margin-top:7px">${new Date(item.createdAt).toLocaleDateString('pt-BR')}</div></div>${item.read?'':'<span class="badge-dot" style="color:var(--gold-bright);margin-top:7px"></span>'}</div>`).join(''):'<div class="empty-state"><div class="icon">🔔</div>Nenhuma notificação.</div>'}document.getElementById('mark-read').onclick=()=>{const all=getAll();all.forEach(x=>{if(x.customerId===customerId)x.read=true});localStorage.setItem(KEY,JSON.stringify(all));render()};render();window.addEventListener('storage',render);</script></body></html>
