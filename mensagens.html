<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mensagens — CortaKi</title><link rel="stylesheet" href="assets/css/style.css"></head><body>
<div class="app-shell messages-app-shell"><div id="topbar"></div><main class="page"><div class="messages-shell"><h1 class="display" style="font-size:24px">Central de mensagens</h1><p class="small muted" style="margin:5px 0 16px">Suporte e atendimentos reunidos em uma única lista.</p><div class="messages-layout"><aside class="conversation-list" id="conversation-list"></aside><section class="message-panel"><header class="message-panel-head" id="panel-head"></header><div class="message-thread" id="message-thread"></div><form class="message-composer" id="message-form"><input id="message-input" maxlength="500" placeholder="Digite uma mensagem..." style="flex:1"><button class="btn btn-primary" aria-label="Enviar mensagem">Enviar</button></form></section></div></div></main><div id="bottom-nav"></div></div>
<script src="assets/js/mock-data.js"></script><script src="assets/js/app.js"></script><script>
const role=['cliente','barbeiro','barbearia'].includes(qs('perfil'))?qs('perfil'):'cliente',identity=role==='cliente'?{id:DEMO_USERS.customer.id,name:localStorage.getItem('navalha_customer_name')||DEMO_USERS.customer.name}:role==='barbeiro'?DEMO_USERS.barber:DEMO_USERS.shop,CHAT_KEY='navalha_appointment_chats',SUPPORT_KEY='cortaki_support_threads',APT_KEY='navalha_appointments';let selectedId=null;renderTopbar({title:'Mensagens'});if(role==='cliente')renderBottomNav('mensagens');else document.getElementById('bottom-nav').remove();
function esc(v){return escapeHTML(String(v??''))}function allAppointments(){const saved=safeStoredJSON(APT_KEY,[]);return [...(Array.isArray(saved)?saved:[]),...APPOINTMENTS].filter((a,i,l)=>l.findIndex(x=>x.id===a.id)===i)}function appointmentThreads(){const chats=safeStoredJSON(CHAT_KEY,{})||{},shopIds=new Set((safeStoredJSON('cortaki_shop_barbers',[])||[]).map(b=>b.id));return allAppointments().filter(a=>role==='cliente'?a.customerId===identity.id:role==='barbeiro'?a.barberId===identity.id:(a.shopId===identity.id||shopIds.has(a.barberId))).filter(a=>['Confirmado','A caminho','Em atendimento','Concluído'].includes(a.status)||Array.isArray(chats[a.id])).map(a=>{const other=role==='cliente'?{id:a.barberId,name:a.barberName}:{id:a.customerId,name:a.customerName};return{id:a.id,name:other.name,subtitle:`${(a.serviceNames||[]).join(', ')} · ${a.status}`,messages:Array.isArray(chats[a.id])?chats[a.id]:[],avatar:avatarFor(other.id,other.name)}})}
function supportData(){const all=safeStoredJSON(SUPPORT_KEY,{})||{},key=`${role}:${identity.id}`;if(!all[key]){all[key]={id:key,messages:[{from:'admin',text:`Olá, ${identity.name.split(' ')[0]}! Este é o suporte CortaKi. Como podemos ajudar?`,at:new Date().toISOString()}]};localStorage.setItem(SUPPORT_KEY,JSON.stringify(all))}return all[key]}function threads(){return[{...supportData(),isSupport:true,name:'Suporte CortaKi',subtitle:'Conversa fixada',avatar:null},...appointmentThreads()]}
function openThread(id){selectedId=id;document.querySelector('.messages-layout').classList.add('chat-open');document.querySelector('.messages-shell').classList.add('mobile-chat-open');document.body.classList.add('message-chat-open');render()}function closeThread(){selectedId=null;document.querySelector('.messages-layout').classList.remove('chat-open');document.querySelector('.messages-shell').classList.remove('mobile-chat-open');document.body.classList.remove('message-chat-open');render()}
function render(){const list=threads(),current=list.find(t=>t.id===selectedId);document.getElementById('conversation-list').innerHTML=list.map(t=>{const last=t.messages?.at(-1);return`<button class="conversation-item" data-id="${esc(t.id)}"><span class="conversation-avatar">${t.avatar?`<img src="${t.avatar}" style="width:100%;height:100%;border-radius:inherit;object-fit:cover">`:appIcon('message')}</span><span class="conversation-main"><span class="conversation-name">${esc(t.name)} ${t.isSupport?'<small class="badge badge-gold">Fixada</small>':''}</span><span class="conversation-preview">${esc(last?.text||t.subtitle)}</span></span></button>`}).join('');document.querySelectorAll('.conversation-item').forEach(b=>b.onclick=()=>openThread(b.dataset.id));const form=document.getElementById('message-form');if(!current){form.style.display='none';return}form.style.display='flex';document.getElementById('panel-head').innerHTML=`<button class="message-back" aria-label="Voltar">${appIcon('back')}</button><span class="message-contact-avatar">${current.avatar?`<img src="${current.avatar}" style="width:100%;height:100%;object-fit:cover">`:appIcon('message')}</span><span class="message-contact-copy"><strong>${esc(current.name)}</strong><span class="small muted" style="display:block">${current.isSupport?'Suporte online':esc(current.subtitle)}</span></span>${appIcon('more')}`;document.querySelector('.message-back').onclick=closeThread;const own=m=>current.isSupport?m.from===role:(role==='cliente'?m.from==='customer':m.from==='barber');const thread=document.getElementById('message-thread');thread.innerHTML=(current.messages||[]).map(m=>`<div class="chat-bubble ${own(m)?'barber':'customer'}">${esc(m.text)}<div style="font-size:10px;opacity:.65;margin-top:3px;text-align:right">${new Date(m.at||Date.now()).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div></div>`).join('');thread.scrollTop=thread.scrollHeight}
document.getElementById('message-form').onsubmit=e=>{e.preventDefault();const input=document.getElementById('message-input'),text=input.value.trim(),current=threads().find(t=>t.id===selectedId);if(!text||!current)return;if(current.isSupport){const all=safeStoredJSON(SUPPORT_KEY,{})||{},key=`${role}:${identity.id}`,t=all[key]||supportData();t.messages.push({from:role,text,at:new Date().toISOString()});all[key]=t;localStorage.setItem(SUPPORT_KEY,JSON.stringify(all))}else{const all=safeStoredJSON(CHAT_KEY,{})||{};(all[selectedId]??=[]).push({from:role==='cliente'?'customer':'barber',text,at:new Date().toISOString()});localStorage.setItem(CHAT_KEY,JSON.stringify(all))}input.value='';render()};render();window.addEventListener('storage',render);
</script></body></html>
