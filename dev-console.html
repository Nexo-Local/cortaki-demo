<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CortaKi — Console de testes v10</title><link rel="stylesheet" href="assets/css/style.css"></head><body><div class="app-shell"><main class="page"><h1 class="display">CortaKi v10 — Console de testes</h1><p class="muted">Somente desenvolvimento local. Este painel não é autenticação real.</p><div class="card"><div class="field"><label>Identidade de teste</label><select id="user"><option value="customer-1">Cliente — Carlos</option><option value="barber-1">Barbeiro — João</option><option value="barber-2">Barbeiro — Marcos</option><option value="shop-admin-1">Barbearia — Admin</option><option value="admin-1">Admin — CortaKi</option></select></div><button class="btn btn-primary" id="save">Usar identidade</button></div><div class="card" style="margin-top:14px"><h2>Testes</h2><div style="display:grid;gap:8px"><button class="btn btn-secondary" id="health">1. Health / DB</button><button class="btn btn-secondary" id="services">2. Serviços do barbeiro</button><button class="btn btn-secondary" id="booking">3. Criar agendamento + idempotência</button><button class="btn btn-secondary" id="security">4. CortaKi Protege</button><button class="btn btn-secondary" id="wallet">5. Carteira</button></div></div><pre id="out" class="card" style="margin-top:14px;white-space:pre-wrap;overflow:auto"></pre></main></div><script src="assets/js/cortaki-api.js"></script><script>
const out=document.getElementById('out'); const log=x=>out.textContent=typeof x==='string'?x:JSON.stringify(x,null,2); document.getElementById('user').value=CORTAKI_API.getDevUser(); document.getElementById('save').onclick=()=>{CORTAKI_API.setDevUser(document.getElementById('user').value);log('Identidade local definida: '+CORTAKI_API.getDevUser())};
document.getElementById('health').onclick=async()=>{try{log(await fetch('/api/health').then(r=>r.json()))}catch(e){log(e.message)}};
document.getElementById('services').onclick=async()=>{try{log(await CORTAKI_API.services('barber-1','shop-1'))}catch(e){log(e.data||e.message)}};
document.getElementById('booking').onclick=async()=>{try{CORTAKI_API.setDevUser('customer-1');const when=new Date(Date.now()+15*60000).toISOString();const key=crypto.randomUUID();const a=await CORTAKI_API.createAppointment({barberId:'barber-1',shopId:null,serviceIds:['svc-b1'],mode:'SCHEDULED',scheduledAt:when,idempotencyKey:key});const replay=await CORTAKI_API.createAppointment({barberId:'barber-1',shopId:null,serviceIds:['svc-b1'],mode:'SCHEDULED',scheduledAt:when,idempotencyKey:key});log({first:a,replay})}catch(e){log(e.data||e.message)}};
document.getElementById('security').onclick=async()=>{try{CORTAKI_API.setDevUser('customer-1');const when=new Date(Date.now()+5*60000).toISOString();const a=await CORTAKI_API.createAppointment({barberId:'barber-1',serviceIds:['svc-b1'],mode:'SCHEDULED',scheduledAt:when,idempotencyKey:crypto.randomUUID()});await CORTAKI_API.simulatePayment(a.appointmentId);await CORTAKI_API.checkin(a.appointmentId);CORTAKI_API.setDevUser('barber-1');await CORTAKI_API.checkin(a.appointmentId);const ok=await CORTAKI_API.verifyCode(a.appointmentId,a.securityCode);const done=await CORTAKI_API.complete(a.appointmentId);log({created:a,verified:ok,completed:done})}catch(e){log(e.data||e.message)}};
document.getElementById('wallet').onclick=async()=>{try{log(await CORTAKI_API.barberWallet())}catch(e){log(e.data||e.message)}};
</script></body></html>
